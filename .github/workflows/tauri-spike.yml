name: Tauri Spike

on:
  push:
    branches: [develop, master, main]
    paths:
      - 'src-tauri/**'
      - 'port/sidecar/**'
      - 'source/**'
      - 'static/**'
      - 'vite.config.ts'
      - 'vite.shared.ts'
      - 'package.json'
      - '.github/workflows/tauri-spike.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'port/sidecar/**'
      - 'source/**'
      - 'static/**'
      - 'vite.config.ts'
      - 'vite.shared.ts'
      - 'package.json'
      - '.github/workflows/tauri-spike.yml'
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'

jobs:
  tauri-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: corepack yarn install --immutable

      - name: Build web frontend
        run: corepack yarn build:web

      - name: Sidecar boot smoke test
        run: corepack yarn sidecar:smoke

      - name: Tauri build (linux x64)
        run: corepack yarn tauri:build
        env:
          TAURI_ENV_PLATFORM: linux
          TAURI_ENV_ARCH: x86_64
